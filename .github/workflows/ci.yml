name: CI-CD

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  VERCEL_CLI_VERSION: "50.40.0"

jobs:
  quality-gate:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      MONGODB_URI: ${{ secrets.MONGODB_URI || 'mongodb://127.0.0.1:27017/nexusai-ci' }}
      REDIS_URL: ${{ secrets.REDIS_URL || '' }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'ci-better-auth-secret-please-change-in-production' }}
      BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL || 'http://127.0.0.1:3000' }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'http://127.0.0.1:3000' }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || 'ci-placeholder.apps.googleusercontent.com' }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET || 'ci-google-client-secret' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'ci-gemini-key' }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY || 'ci-pollinations-key' }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY || 'sk_test_ci_placeholder' }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET || 'whsec_ci_placeholder' }}
      STRIPE_PRICE_ID_PRO: ${{ secrets.STRIPE_PRICE_ID_PRO || 'price_ci_pro' }}
      STRIPE_PRICE_ID_PREMIUM: ${{ secrets.STRIPE_PRICE_ID_PREMIUM || 'price_ci_premium' }}
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME || 'ci-cloudinary-cloud' }}
      UPLOADTHING_TOKEN: ${{ secrets.UPLOADTHING_TOKEN || 'ci-uploadthing-token' }}
      IMAGEKIT_PUBLIC_KEY: ${{ secrets.IMAGEKIT_PUBLIC_KEY || 'ci-imagekit-public-key' }}
      IMAGEKIT_PRIVATE_KEY: ${{ secrets.IMAGEKIT_PRIVATE_KEY || 'ci-imagekit-private-key' }}
      IMAGEKIT_URL_ENDPOINT: ${{ secrets.IMAGEKIT_URL_ENDPOINT || 'https://ik.imagekit.io/ci-project' }}
      EMAIL_SERVER_HOST: ${{ secrets.EMAIL_SERVER_HOST || 'smtp.example.com' }}
      EMAIL_SERVER_PORT: ${{ secrets.EMAIL_SERVER_PORT || '587' }}
      EMAIL_SERVER_USER: ${{ secrets.EMAIL_SERVER_USER || 'ci@example.com' }}
      EMAIL_SERVER_PASSWORD: ${{ secrets.EMAIL_SERVER_PASSWORD || 'ci-email-password' }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM || 'noreply@example.com' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:ci

      - name: Build application
        run: npm run build

  deploy-preview:
    name: Deploy Preview to Vercel
    needs: quality-gate
    if: github.event_name == 'push' && github.ref_name != 'main' && github.ref_name != 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview
    env:
      CI: "true"
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Vercel credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"

      - name: Install Vercel CLI
        run: npm install --global vercel@${{ env.VERCEL_CLI_VERSION }}

      - name: Pull Vercel preview environment
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build Vercel artifacts
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy preview
        id: deploy_preview
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(
            vercel deploy --prebuilt --archive=tgz --token="$VERCEL_TOKEN" \
              -m githubDeployment=1 \
              -m githubCommitSha="${GITHUB_SHA}" \
              -m githubCommitRef="${GITHUB_REF_NAME}" \
              -m githubCommitMessage="${{ github.event.head_commit.message }}" \
              -m githubCommitAuthorName="${{ github.actor }}" \
              -m githubCommitOrg="${{ github.repository_owner }}" \
              -m githubCommitRepo="${{ github.event.repository.name }}" \
              -m githubOrg="${{ github.repository_owner }}" \
              -m githubRepo="${{ github.event.repository.name }}"
          )"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Preview deployment: $deployment_url" >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Deploy Production to Vercel
    needs: quality-gate
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && (github.ref_name == 'main' || github.ref_name == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CI: "true"
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Vercel credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"

      - name: Install Vercel CLI
        run: npm install --global vercel@${{ env.VERCEL_CLI_VERSION }}

      - name: Pull Vercel production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel artifacts
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production
        id: deploy_production
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(
            vercel deploy --prebuilt --archive=tgz --prod --token="$VERCEL_TOKEN" \
              -m githubDeployment=1 \
              -m githubCommitSha="${GITHUB_SHA}" \
              -m githubCommitRef="${GITHUB_REF_NAME}" \
              -m githubCommitMessage="${{ github.event.head_commit.message || 'Manual production deployment' }}" \
              -m githubCommitAuthorName="${{ github.actor }}" \
              -m githubCommitOrg="${{ github.repository_owner }}" \
              -m githubCommitRepo="${{ github.event.repository.name }}" \
              -m githubOrg="${{ github.repository_owner }}" \
              -m githubRepo="${{ github.event.repository.name }}"
          )"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $deployment_url" >> "$GITHUB_STEP_SUMMARY"
